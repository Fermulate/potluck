<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf5ea" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Split expenses and plan get-togethers with your people." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Potluck</title>
    <style>
      /* First paint before the token stylesheet loads. Values mirror @potluck/tokens. */
      html { background: #fbf5ea; color: #1d1a16; }
      html[data-theme='dark'] { background: #14110e; color: #f6efe3; }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme='light']) { background: #14110e; color: #f6efe3; }
      }
    </style>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('potluck.theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
