<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf5ea" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Split expenses and plan get-togethers with your people." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Potluck" />
    <title>Potluck</title>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Potluck" />
    <meta property="og:title" content="Potluck" />
    <meta
      property="og:description"
      content="Split expenses and plan get-togethers with your people."
    />
    <meta property="og:url" content="%VITE_APP_URL%/" />
    <meta property="og:image" content="%VITE_APP_URL%/pwa-512x512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Potluck" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Potluck" />
    <meta
      name="twitter:description"
      content="Split expenses and plan get-togethers with your people."
    />
    <style>
      /* First paint before the token stylesheet loads. Values mirror @potluck/tokens. */
      html {
        background: #fbf5ea;
        color: #1d1a16;
      }
      html[data-theme='dark'] {
        background: #14110e;
        color: #f6efe3;
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme='light']) {
          background: #14110e;
          color: #f6efe3;
        }
      }
    </style>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('potluck.theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
