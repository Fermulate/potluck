name: Bug report
description: Something is broken or behaves unexpectedly.
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: Thanks for reporting. Please search existing issues first. For security problems, do not open an issue; see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Tap ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - Web (desktop)
        - Web (mobile browser)
        - Installed PWA
        - Other
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: e.g. Safari 19 on iOS 20
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
      description: Anything else that helps. Remove personal data first.
