name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Verify (format, lint, generated files, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Format, lint, generated files (route tree, agent map, skills copy), typecheck, unit
      # tests with coverage, edge function tests and a production build with placeholder env.
      # Same script developers and agents run: scripts/verify.mjs.
      - run: pnpm verify
      - name: Coverage summary
        if: always()
        run: |
          {
            echo '## Coverage'
            for f in packages/*/coverage/coverage-summary.json apps/*/coverage/coverage-summary.json; do
              [ -f "$f" ] || continue
              pkg=$(dirname "$(dirname "$f")")
              node -e "const s=require('./$f').total;console.log('| $pkg | '+['statements','branches','functions','lines'].map(k=>s[k].pct+'%').join(' | ')+' |')"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: coverage
          path: |
            packages/*/coverage
            apps/*/coverage
          if-no-files-found: ignore

  db:
    name: Database tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      - run: pnpm install --frozen-lockfile
      - run: supabase start -x studio,imgproxy,vector,logflare,supavisor
      # db lint, pgTAP, then the committed schema snapshot and database types must match a
      # fresh generation. Same script as scripts/verify.mjs --db.
      - run: pnpm verify:db

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      - run: pnpm install --frozen-lockfile
      - run: supabase start -x studio,imgproxy,vector,logflare,supavisor
      - name: Write local env
        run: |
          supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY)=' > /tmp/sb.env
          . /tmp/sb.env
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_PUBLISHABLE_KEY=%s\nVITE_APP_URL=http://localhost:4173\n' "$API_URL" "$PUBLISHABLE_KEY" > .env.local
      # The local Realtime tenant allows 100 Postgres change messages a second and drops the rest
      # (MessagePerSecondRateLimitReached), which parallel journeys pass. Raise it, then restart
      # Realtime so it rereads the tenant.
      - name: Raise Realtime limits
        run: |
          docker exec supabase_db_potluck psql -U postgres -v ON_ERROR_STOP=1 -c             "update _realtime.tenants set max_events_per_second = 1000, max_joins_per_second = 500 where external_id = 'realtime-dev'"
          docker restart supabase_realtime_potluck
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' supabase_realtime_potluck)" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' supabase_realtime_potluck
      - run: pnpm --filter @potluck/web exec playwright install --with-deps chromium webkit
      - run: pnpm e2e
      # Live updates are silent when Realtime drops a change (a rate limit, or a policy that errors
      # or times out for the subscriber), so keep its log when a journey fails.
      - name: Realtime log
        if: failure()
        run: docker logs supabase_realtime_potluck 2>&1 | tail -n 400
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
